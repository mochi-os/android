org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# AGP 9 compiles Kotlin in Gradle workers, and 16 modules building in parallel
# exhaust the default worker heap partway through the app modules.
kotlin.daemon.jvmargs=-Xmx4096m
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# AGP 9's built-in Kotlin rejects sources registered through the kotlin.sourceSets
# DSL, and KSP registers its generated output that way. Hilt's code generation is
# what depends on it, so the choice is this flag or dropping KSP; AGP documents
# the flag for exactly this case. Remove it once KSP registers through
# android.sourceSets on its own.
android.disallowKotlinSourceSets=false
