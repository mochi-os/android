name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Compiling every module runs tools/check-locales.py --strict through
      # each module's preBuild, so a catalogue gap fails here as it does locally.
      - name: Compile and test
        run: ./gradlew --console=plain compileDebugKotlin testDebugUnitTest

      # Every module's lint, so a new error fails here rather than piling up
      # unseen. --continue reports every failing module, not just the first;
      # lint.xml holds the project's exceptions.
      - name: Lint
        run: ./gradlew --console=plain --continue lintDebug
